<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Journey MCP demo</title>
<style>
  body { margin:0; background:#f4f6fa; color:#152238; font:18px/1.6 system-ui,sans-serif; }
  main { max-width:700px; margin:12vh auto; padding:32px; }
  small { color:#526680; letter-spacing:.12em; }
  h1 { font-size:clamp(32px,6vw,56px); line-height:1.1; margin:20px 0; }
  section { background:white; padding:24px; border-radius:16px; box-shadow:0 4px 24px #1522380a; }
  button { font:inherit; border:1px solid #bbc5d3; border-radius:8px; background:white; padding:12px 18px; cursor:pointer; }
  button:focus-visible { outline:3px solid #3971cf; outline-offset:3px; }
</style>
<main><small>UI JOURNEY MCP / DEMO</small><h1>A flow worth remembering.</h1>
<p>A small, reproducible interaction for capturing versioned evidence.</p>
<section><h2>Where is evidence stored?</h2><button aria-expanded="false" aria-controls="answer">Open answer</button>
<p id="answer" hidden>Your evidence stays with your project.</p></section></main>
<script>
  document.querySelector('button').addEventListener('click', event => {
    document.querySelector('#answer').hidden = false;
    event.currentTarget.setAttribute('aria-expanded', 'true');
  });
</script></html>
